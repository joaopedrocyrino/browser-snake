<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no"
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <meta name="theme-color" content="#000000" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Snake" />
    <title>João Cyrino - Snake Game</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        font-family: "Courier New", monospace;
      }
      body[data-theme="dark"] {
        --snk-bg: #000;
        --snk-fg: #00ff00;
        --snk-border: rgba(0, 255, 0, 0.45);
        --snk-btn-bg: rgba(0, 0, 0, 0.55);
      }
      body[data-theme="light"] {
        --snk-bg: #f5f5f1;
        --snk-fg: #1a4d1a;
        --snk-border: rgba(26, 77, 26, 0.45);
        --snk-btn-bg: rgba(255, 255, 255, 0.65);
      }
      body {
        background: var(--snk-bg);
        color: var(--snk-fg);
        -webkit-user-select: none;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
        transition: background 0.18s ease, color 0.18s ease;
      }
      #game {
        background: var(--snk-bg);
        image-rendering: pixelated;
        display: block;
      }
      .snk-controls {
        position: fixed;
        bottom: 8px;
        right: 8px;
        display: flex;
        gap: 6px;
        z-index: 10;
      }
      .snk-controls button {
        font-family: inherit;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.04em;
        background: var(--snk-btn-bg);
        color: var(--snk-fg);
        border: 1px solid var(--snk-border);
        padding: 4px 8px;
        min-width: 30px;
        cursor: pointer;
        backdrop-filter: blur(2px);
        -webkit-backdrop-filter: blur(2px);
        transition: background 0.18s ease, color 0.18s ease,
          border-color 0.18s ease;
      }
      .snk-controls button:active {
        transform: translateY(1px);
      }
    </style>
  </head>
  <!-- data-theme starts as "dark" so the first paint never flashes light
       before main.ts boots and applies the detected/saved theme. -->
  <body data-theme="dark">
    <canvas id="game"></canvas>
    <div class="snk-controls" aria-label="settings">
      <button id="lang-toggle" type="button" title="Language">EN</button>
      <button id="theme-toggle" type="button" title="Theme">☀</button>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
